syntax = "proto3";

// Provider: aws 6
package terraform.aws.datasources.v6;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// AwsCustomerGateway version is 0
message AwsCustomerGateway {
  string arn = 1;

  int64 bgp_asn = 2 [json_name = "bgp_asn"];

  int64 bgp_asn_extended = 3 [json_name = "bgp_asn_extended"];

  string certificate_arn = 4 [json_name = "certificate_arn"];

  string device_name = 5 [json_name = "device_name"];

  string id = 6;

  string ip_address = 7 [json_name = "ip_address"];

  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 8;

  map<string, string> tags = 9;

  string type = 10;

  repeated Filter filter = 11;

  repeated Timeouts timeouts = 12;

  google.protobuf.Value for_each = 13 [json_name = "for_each"];

  repeated string depends_on = 14 [json_name = "depends_on"];

  int32 count = 15;

  string provider = 16;

  terraform.v1.Lifecycle lifecycle = 17;

  message Filter {
    string name = 1;

    repeated string values = 2;
  }

  message Timeouts {
    string read = 1;
  }
}
