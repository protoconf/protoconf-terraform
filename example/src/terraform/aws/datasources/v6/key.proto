syntax = "proto3";

// Provider: aws 6
package terraform.aws.datasources.v6;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// AwsKeyPair version is 0
message AwsKeyPair {
  string arn = 1;

  string create_time = 2 [json_name = "create_time"];

  string fingerprint = 3;

  string id = 4;

  bool include_public_key = 5 [json_name = "include_public_key"];

  string key_name = 6 [json_name = "key_name"];

  string key_pair_id = 7 [json_name = "key_pair_id"];

  string key_type = 8 [json_name = "key_type"];

  string public_key = 9 [json_name = "public_key"];

  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 10;

  map<string, string> tags = 11;

  repeated Filter filter = 12;

  repeated Timeouts timeouts = 13;

  google.protobuf.Value for_each = 14 [json_name = "for_each"];

  repeated string depends_on = 15 [json_name = "depends_on"];

  int32 count = 16;

  string provider = 17;

  terraform.v1.Lifecycle lifecycle = 18;

  message Filter {
    string name = 1;

    repeated string values = 2;
  }

  message Timeouts {
    string read = 1;
  }
}
