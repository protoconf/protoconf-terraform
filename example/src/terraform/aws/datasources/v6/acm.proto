syntax = "proto3";

// Provider: aws 6
package terraform.aws.datasources.v6;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// AwsAcmCertificate version is 0
message AwsAcmCertificate {
  string arn = 1;

  string certificate = 2;

  string certificate_chain = 3 [json_name = "certificate_chain"];

  string domain = 4;

  string id = 5;

  repeated string key_types = 6 [json_name = "key_types"];

  bool most_recent = 7 [json_name = "most_recent"];

  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 8;

  string status = 9;

  repeated string statuses = 10;

  map<string, string> tags = 11;

  repeated string types = 12;

  google.protobuf.Value for_each = 13 [json_name = "for_each"];

  repeated string depends_on = 14 [json_name = "depends_on"];

  int32 count = 15;

  string provider = 16;

  terraform.v1.Lifecycle lifecycle = 17;
}
