syntax = "proto3";

// Provider: aws 6
package terraform.aws.datasources.v6;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// AwsRamResourceShare version is 0
message AwsRamResourceShare {
  string arn = 1;

  string id = 2;

  string name = 3;

  string owning_account_id = 4 [json_name = "owning_account_id"];

  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 5;

  repeated string resource_arns = 6 [json_name = "resource_arns"];

  string resource_owner = 7 [json_name = "resource_owner"];

  string resource_share_status = 8 [json_name = "resource_share_status"];

  string status = 9;

  map<string, string> tags = 10;

  repeated Filter filter = 11;

  google.protobuf.Value for_each = 12 [json_name = "for_each"];

  repeated string depends_on = 13 [json_name = "depends_on"];

  int32 count = 14;

  string provider = 15;

  terraform.v1.Lifecycle lifecycle = 16;

  message Filter {
    string name = 1;

    repeated string values = 2;
  }
}
