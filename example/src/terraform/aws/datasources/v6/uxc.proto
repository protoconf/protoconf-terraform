syntax = "proto3";

// Provider: aws 6
package terraform.aws.datasources.v6;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// AwsUxcServices version is 0
message AwsUxcServices {
  repeated string services = 1;

  google.protobuf.Value for_each = 2 [json_name = "for_each"];

  repeated string depends_on = 3 [json_name = "depends_on"];

  int32 count = 4;

  string provider = 5;

  terraform.v1.Lifecycle lifecycle = 6;
}
