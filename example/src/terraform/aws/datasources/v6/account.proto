syntax = "proto3";

// Provider: aws 6
package terraform.aws.datasources.v6;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// AwsAccountPrimaryContact version is 0
message AwsAccountPrimaryContact {
  string account_id = 1 [json_name = "account_id"];

  string address_line_1 = 2 [json_name = "address_line_1"];

  string address_line_2 = 3 [json_name = "address_line_2"];

  string address_line_3 = 4 [json_name = "address_line_3"];

  string city = 5;

  string company_name = 6 [json_name = "company_name"];

  string country_code = 7 [json_name = "country_code"];

  string district_or_county = 8 [json_name = "district_or_county"];

  string full_name = 9 [json_name = "full_name"];

  string phone_number = 10 [json_name = "phone_number"];

  string postal_code = 11 [json_name = "postal_code"];

  string state_or_region = 12 [json_name = "state_or_region"];

  string website_url = 13 [json_name = "website_url"];

  google.protobuf.Value for_each = 14 [json_name = "for_each"];

  repeated string depends_on = 15 [json_name = "depends_on"];

  int32 count = 16;

  string provider = 17;

  terraform.v1.Lifecycle lifecycle = 18;
}

// AwsAccountRegions version is 0
message AwsAccountRegions {
  string account_id = 1 [json_name = "account_id"];

  repeated string region_opt_status_contains = 2 [json_name = "region_opt_status_contains"];

  repeated Regions regions = 3;

  google.protobuf.Value for_each = 4 [json_name = "for_each"];

  repeated string depends_on = 5 [json_name = "depends_on"];

  int32 count = 6;

  string provider = 7;

  terraform.v1.Lifecycle lifecycle = 8;

  message Regions {
    // region_name: string
    string region_name = 1 [json_name = "region_name"];

    // region_opt_status: string
    string region_opt_status = 2 [json_name = "region_opt_status"];
  }
}
