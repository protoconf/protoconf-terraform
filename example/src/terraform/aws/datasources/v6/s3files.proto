syntax = "proto3";

// Provider: aws 6
package terraform.aws.datasources.v6;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// AwsS3filesAccessPoint version is 0
message AwsS3filesAccessPoint {
  string arn = 1;

  // File system ID
  string file_system_id = 2 [json_name = "file_system_id"];

  // Access point ID
  string id = 3;

  // Access point name
  string name = 4;

  // AWS account ID of the owner
  string owner_id = 5 [json_name = "owner_id"];

  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 6;

  // Access point status
  string status = 7;

  map<string, string> tags = 8;

  repeated PosixUser posix_user = 9 [json_name = "posix_user"];

  repeated RootDirectory root_directory = 10 [json_name = "root_directory"];

  google.protobuf.Value for_each = 11 [json_name = "for_each"];

  repeated string depends_on = 12 [json_name = "depends_on"];

  int32 count = 13;

  string provider = 14;

  terraform.v1.Lifecycle lifecycle = 15;

  message PosixUser {
    // POSIX group ID
    int64 gid = 1;

    // Secondary POSIX group IDs
    repeated int64 secondary_gids = 2 [json_name = "secondary_gids"];

    // POSIX user ID
    int64 uid = 3;
  }

  message RootDirectory {
    // Root directory path
    string path = 1;

    repeated CreationPermissions creation_permissions = 2 [json_name = "creation_permissions"];

    message CreationPermissions {
      // Owner group ID
      int64 owner_gid = 1 [json_name = "owner_gid"];

      // Owner user ID
      int64 owner_uid = 2 [json_name = "owner_uid"];

      // POSIX permissions
      string permissions = 3;
    }
  }
}

// AwsS3filesFileSystem version is 0
message AwsS3filesFileSystem {
  string arn = 1;

  // S3 bucket ARN
  string bucket = 2;

  // Creation time
  string creation_time = 3 [json_name = "creation_time"];

  // File system ID
  string id = 4;

  // KMS key ID for encryption
  string kms_key_id = 5 [json_name = "kms_key_id"];

  // File system name
  string name = 6;

  // AWS account ID of the owner
  string owner_id = 7 [json_name = "owner_id"];

  // S3 bucket prefix
  string prefix = 8;

  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 9;

  // IAM role ARN for S3 access
  string role_arn = 10 [json_name = "role_arn"];

  // File system status
  string status = 11;

  // Status message
  string status_message = 12 [json_name = "status_message"];

  map<string, string> tags = 13;

  google.protobuf.Value for_each = 14 [json_name = "for_each"];

  repeated string depends_on = 15 [json_name = "depends_on"];

  int32 count = 16;

  string provider = 17;

  terraform.v1.Lifecycle lifecycle = 18;
}

// AwsS3filesFileSystems version is 0
message AwsS3filesFileSystems {
  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 1;

  repeated FileSystems file_systems = 2 [json_name = "file_systems"];

  google.protobuf.Value for_each = 3 [json_name = "for_each"];

  repeated string depends_on = 4 [json_name = "depends_on"];

  int32 count = 5;

  string provider = 6;

  terraform.v1.Lifecycle lifecycle = 7;

  message FileSystems {
    // File system ARN
    string arn = 1;

    // S3 bucket ARN
    string bucket = 2;

    // Creation time
    string creation_time = 3 [json_name = "creation_time"];

    // File system ID
    string id = 4;

    // KMS key ID for encryption
    string kms_key_id = 5 [json_name = "kms_key_id"];

    // File system name
    string name = 6;

    // AWS account ID of the owner
    string owner_id = 7 [json_name = "owner_id"];

    // IAM role ARN
    string role_arn = 8 [json_name = "role_arn"];

    // File system status
    string status = 9;

    // Status message
    string status_message = 10 [json_name = "status_message"];
  }
}

// AwsS3filesMountTarget version is 0
message AwsS3filesMountTarget {
  // Availability Zone ID
  string availability_zone_id = 1 [json_name = "availability_zone_id"];

  // File system ID
  string file_system_id = 2 [json_name = "file_system_id"];

  // Mount target ID
  string id = 3;

  // IPv4 address
  string ipv4_address = 4 [json_name = "ipv4_address"];

  // IPv6 address
  string ipv6_address = 5 [json_name = "ipv6_address"];

  // Network interface ID
  string network_interface_id = 6 [json_name = "network_interface_id"];

  // AWS account ID of the owner
  string owner_id = 7 [json_name = "owner_id"];

  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 8;

  // Security group IDs
  repeated string security_groups = 9 [json_name = "security_groups"];

  // Mount target status
  string status = 10;

  // Status message
  string status_message = 11 [json_name = "status_message"];

  // Subnet ID
  string subnet_id = 12 [json_name = "subnet_id"];

  // VPC ID
  string vpc_id = 13 [json_name = "vpc_id"];

  google.protobuf.Value for_each = 14 [json_name = "for_each"];

  repeated string depends_on = 15 [json_name = "depends_on"];

  int32 count = 16;

  string provider = 17;

  terraform.v1.Lifecycle lifecycle = 18;
}
