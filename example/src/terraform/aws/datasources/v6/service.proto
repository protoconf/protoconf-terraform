  message HealthCheckConfig {
    // failure_threshold: number
    int64 failure_threshold = 1 [json_name = "failure_threshold"];

    // resource_path: string
    string resource_path = 2 [json_name = "resource_path"];

    // type: string
    string type = 3;
  }

  message HealthCheckCustomConfig {
    // failure_threshold: number
    int64 failure_threshold = 1 [json_name = "failure_threshold"];
  }
