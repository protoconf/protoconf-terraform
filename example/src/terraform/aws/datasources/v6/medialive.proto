syntax = "proto3";

// Provider: aws 6
package terraform.aws.datasources.v6;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// AwsMedialiveInput version is 0
message AwsMedialiveInput {
  string arn = 1;

  repeated string attached_channels = 2 [json_name = "attached_channels"];

  repeated Destinations destinations = 3;

  string id = 4;

  string input_class = 5 [json_name = "input_class"];

  repeated InputDevices input_devices = 6 [json_name = "input_devices"];

  repeated string input_partner_ids = 7 [json_name = "input_partner_ids"];

  string input_source_type = 8 [json_name = "input_source_type"];

  repeated MediaConnectFlows media_connect_flows = 9 [json_name = "media_connect_flows"];

  string name = 10;

  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 11;

  string role_arn = 12 [json_name = "role_arn"];

  repeated string security_groups = 13 [json_name = "security_groups"];

  repeated Sources sources = 14;

  string state = 15;

  map<string, string> tags = 16;

  string type = 17;

  google.protobuf.Value for_each = 18 [json_name = "for_each"];

  repeated string depends_on = 19 [json_name = "depends_on"];

  int32 count = 20;

  string provider = 21;

  terraform.v1.Lifecycle lifecycle = 22;

  message Destinations {
    // ip: string
    string ip = 1;

    // port: string
    string port = 2;

    // url: string
    string url = 3;

    // vpc: list of object
    repeated Vpc vpc = 4;

    message Vpc {
      // availability_zone: string
      string availability_zone = 1 [json_name = "availability_zone"];

      // network_interface_id: string
      string network_interface_id = 2 [json_name = "network_interface_id"];
    }
  }

  message InputDevices {
    // id: string
    string id = 1;
  }

  message MediaConnectFlows {
    // flow_arn: string
    string flow_arn = 1 [json_name = "flow_arn"];
  }

  message Sources {
    // password_param: string
    string password_param = 1 [json_name = "password_param"];

    // url: string
    string url = 2;

    // username: string
    string username = 3;
  }
}
