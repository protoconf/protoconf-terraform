syntax = "proto3";

// Provider: aws 6
package terraform.aws.datasources.v6;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// AwsOpensearchDomain version is 0
message AwsOpensearchDomain {
  string access_policies = 1 [json_name = "access_policies"];

  map<string, string> advanced_options = 2 [json_name = "advanced_options"];

  repeated AdvancedSecurityOptions advanced_security_options = 3 [json_name = "advanced_security_options"];

  string arn = 4;

  repeated AutoTuneOptions auto_tune_options = 5 [json_name = "auto_tune_options"];

  repeated ClusterConfig cluster_config = 6 [json_name = "cluster_config"];

  repeated CognitoOptions cognito_options = 7 [json_name = "cognito_options"];

  bool created = 8;

  string dashboard_endpoint = 9 [json_name = "dashboard_endpoint"];

  string dashboard_endpoint_v2 = 10 [json_name = "dashboard_endpoint_v2"];

  bool deleted = 11;

  repeated DeploymentStrategyOptions deployment_strategy_options = 12 [json_name = "deployment_strategy_options"];

  string domain_endpoint_v2_hosted_zone_id = 13 [json_name = "domain_endpoint_v2_hosted_zone_id"];

  string domain_id = 14 [json_name = "domain_id"];

  string domain_name = 15 [json_name = "domain_name"];

  repeated EbsOptions ebs_options = 16 [json_name = "ebs_options"];

  repeated EncryptionAtRest encryption_at_rest = 17 [json_name = "encryption_at_rest"];

  string endpoint = 18;

  string endpoint_v2 = 19 [json_name = "endpoint_v2"];

  string engine_version = 20 [json_name = "engine_version"];

  string id = 21;

  repeated IdentityCenterOptions identity_center_options = 22 [json_name = "identity_center_options"];

  string ip_address_type = 23 [json_name = "ip_address_type"];

  repeated LogPublishingOptions log_publishing_options = 24 [json_name = "log_publishing_options"];

  repeated NodeToNodeEncryption node_to_node_encryption = 25 [json_name = "node_to_node_encryption"];

  repeated OffPeakWindowOptions off_peak_window_options = 26 [json_name = "off_peak_window_options"];

  bool processing = 27;

  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 28;

  repeated SnapshotOptions snapshot_options = 29 [json_name = "snapshot_options"];

  repeated SoftwareUpdateOptions software_update_options = 30 [json_name = "software_update_options"];

  map<string, string> tags = 31;

  repeated VpcOptions vpc_options = 32 [json_name = "vpc_options"];

  google.protobuf.Value for_each = 33 [json_name = "for_each"];

  repeated string depends_on = 34 [json_name = "depends_on"];

  int32 count = 35;

  string provider = 36;

  terraform.v1.Lifecycle lifecycle = 37;

  message AdvancedSecurityOptions {
    // anonymous_auth_enabled: bool
    bool anonymous_auth_enabled = 1 [json_name = "anonymous_auth_enabled"];

    // enabled: bool
    bool enabled = 2;

    // internal_user_database_enabled: bool
    bool internal_user_database_enabled = 3 [json_name = "internal_user_database_enabled"];
  }

  message AutoTuneOptions {
    // desired_state: string
    string desired_state = 1 [json_name = "desired_state"];

    // maintenance_schedule: set of object
    repeated MaintenanceSchedule maintenance_schedule = 2 [json_name = "maintenance_schedule"];

    // rollback_on_disable: string
    string rollback_on_disable = 3 [json_name = "rollback_on_disable"];

    // use_off_peak_window: bool
    bool use_off_peak_window = 4 [json_name = "use_off_peak_window"];

    message MaintenanceSchedule {
      // cron_expression_for_recurrence: string
      string cron_expression_for_recurrence = 1 [json_name = "cron_expression_for_recurrence"];

      // duration: list of object
      repeated Duration duration = 2;

      // start_at: string
      string start_at = 3 [json_name = "start_at"];

      message Duration {
        // unit: string
        string unit = 1;

        // value: number
        int64 value = 2;
      }
    }
  }

  message ClusterConfig {
    // cold_storage_options: list of object
    repeated ColdStorageOptions cold_storage_options = 1 [json_name = "cold_storage_options"];

    // dedicated_master_count: number
    int64 dedicated_master_count = 2 [json_name = "dedicated_master_count"];

    // dedicated_master_enabled: bool
    bool dedicated_master_enabled = 3 [json_name = "dedicated_master_enabled"];

    // dedicated_master_type: string
    string dedicated_master_type = 4 [json_name = "dedicated_master_type"];

    // instance_count: number
    int64 instance_count = 5 [json_name = "instance_count"];

    // instance_type: string
    string instance_type = 6 [json_name = "instance_type"];

    // multi_az_with_standby_enabled: bool
    bool multi_az_with_standby_enabled = 7 [json_name = "multi_az_with_standby_enabled"];

    // node_options: list of object
    repeated NodeOptions node_options = 8 [json_name = "node_options"];

    // warm_count: number
    int64 warm_count = 9 [json_name = "warm_count"];

    // warm_enabled: bool
    bool warm_enabled = 10 [json_name = "warm_enabled"];

    // warm_type: string
    string warm_type = 11 [json_name = "warm_type"];

    // zone_awareness_config: list of object
    repeated ZoneAwarenessConfig zone_awareness_config = 12 [json_name = "zone_awareness_config"];

    // zone_awareness_enabled: bool
    bool zone_awareness_enabled = 13 [json_name = "zone_awareness_enabled"];

    message ColdStorageOptions {
      // enabled: bool
      bool enabled = 1;
    }

    message NodeOptions {
      // node_config: list of object
      repeated NodeConfig node_config = 1 [json_name = "node_config"];

      // node_type: string
      string node_type = 2 [json_name = "node_type"];

      message NodeConfig {
        // count: number
        int64 count = 1;

        // enabled: bool
        bool enabled = 2;

        // type: string
        string type = 3;
      }
    }

    message ZoneAwarenessConfig {
      // availability_zone_count: number
      int64 availability_zone_count = 1 [json_name = "availability_zone_count"];
    }
  }

  message CognitoOptions {
    // enabled: bool
    bool enabled = 1;

    // identity_pool_id: string
    string identity_pool_id = 2 [json_name = "identity_pool_id"];

    // role_arn: string
    string role_arn = 3 [json_name = "role_arn"];

    // user_pool_id: string
    string user_pool_id = 4 [json_name = "user_pool_id"];
  }

  message DeploymentStrategyOptions {
    // deployment_strategy: string
    string deployment_strategy = 1 [json_name = "deployment_strategy"];
  }

  message EbsOptions {
    // ebs_enabled: bool
    bool ebs_enabled = 1 [json_name = "ebs_enabled"];

    // iops: number
    int64 iops = 2;

    // throughput: number
    int64 throughput = 3;

    // volume_size: number
    int64 volume_size = 4 [json_name = "volume_size"];

    // volume_type: string
    string volume_type = 5 [json_name = "volume_type"];
  }

  message EncryptionAtRest {
    // enabled: bool
    bool enabled = 1;

    // kms_key_id: string
    string kms_key_id = 2 [json_name = "kms_key_id"];
  }

  message IdentityCenterOptions {
    // enabled_api_access: bool
    bool enabled_api_access = 1 [json_name = "enabled_api_access"];

    // identity_center_instance_arn: string
    string identity_center_instance_arn = 2 [json_name = "identity_center_instance_arn"];

    // roles_key: string
    string roles_key = 3 [json_name = "roles_key"];

    // subject_key: string
    string subject_key = 4 [json_name = "subject_key"];
  }

  message LogPublishingOptions {
    // cloudwatch_log_group_arn: string
    string cloudwatch_log_group_arn = 1 [json_name = "cloudwatch_log_group_arn"];

    // enabled: bool
    bool enabled = 2;

    // log_type: string
    string log_type = 3 [json_name = "log_type"];
  }

  message NodeToNodeEncryption {
    // enabled: bool
    bool enabled = 1;
  }

  message OffPeakWindowOptions {
    // enabled: bool
    bool enabled = 1;

    // off_peak_window: list of object
    repeated OffPeakWindow off_peak_window = 2 [json_name = "off_peak_window"];

    message OffPeakWindow {
      // window_start_time: list of object
      repeated WindowStartTime window_start_time = 1 [json_name = "window_start_time"];

      message WindowStartTime {
        // hours: number
        int64 hours = 1;

        // minutes: number
        int64 minutes = 2;
      }
    }
  }

  message SnapshotOptions {
    // automated_snapshot_start_hour: number
    int64 automated_snapshot_start_hour = 1 [json_name = "automated_snapshot_start_hour"];
  }

  message SoftwareUpdateOptions {
    // auto_software_update_enabled: bool
    bool auto_software_update_enabled = 1 [json_name = "auto_software_update_enabled"];
  }

  message VpcOptions {
    // availability_zones: set of string
    repeated string availability_zones = 1 [json_name = "availability_zones"];

    // security_group_ids: set of string
    repeated string security_group_ids = 2 [json_name = "security_group_ids"];

    // subnet_ids: set of string
    repeated string subnet_ids = 3 [json_name = "subnet_ids"];

    // vpc_id: string
    string vpc_id = 4 [json_name = "vpc_id"];
  }
}
