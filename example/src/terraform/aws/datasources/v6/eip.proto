  string association_id = 2 [json_name = "association_id"];

  string carrier_ip = 3 [json_name = "carrier_ip"];

  string customer_owned_ip = 4 [json_name = "customer_owned_ip"];

  string customer_owned_ipv4_pool = 5 [json_name = "customer_owned_ipv4_pool"];

  string domain = 6;

  string id = 7;

  string instance_id = 8 [json_name = "instance_id"];

  string ipam_pool_id = 9 [json_name = "ipam_pool_id"];

  string network_interface_id = 10 [json_name = "network_interface_id"];

  string network_interface_owner_id = 11 [json_name = "network_interface_owner_id"];

  string private_dns = 12 [json_name = "private_dns"];

  string private_ip = 13 [json_name = "private_ip"];

