syntax = "proto3";

// Provider: aws 6
package terraform.aws.datasources.v6;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// AwsRedshiftserverlessCredentials version is 0
message AwsRedshiftserverlessCredentials {
  string db_name = 1 [json_name = "db_name"];

  string db_password = 2 [json_name = "db_password"];

  string db_user = 3 [json_name = "db_user"];

  int64 duration_seconds = 4 [json_name = "duration_seconds"];

  string expiration = 5;

  string id = 6;

  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 7;

  string workgroup_name = 8 [json_name = "workgroup_name"];

  google.protobuf.Value for_each = 9 [json_name = "for_each"];

  repeated string depends_on = 10 [json_name = "depends_on"];

  int32 count = 11;

  string provider = 12;

  terraform.v1.Lifecycle lifecycle = 13;
}

// AwsRedshiftserverlessNamespace version is 0
message AwsRedshiftserverlessNamespace {
