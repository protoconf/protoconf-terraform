syntax = "proto3";

// Provider: aws 6
package terraform.aws.datasources.v6;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// AwsEcrpublicAuthorizationToken version is 0
message AwsEcrpublicAuthorizationToken {
  string authorization_token = 1 [json_name = "authorization_token"];

  string expires_at = 2 [json_name = "expires_at"];

  string id = 3;

  string password = 4;

  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 5;

  string user_name = 6 [json_name = "user_name"];

  google.protobuf.Value for_each = 7 [json_name = "for_each"];

  repeated string depends_on = 8 [json_name = "depends_on"];

  int32 count = 9;

  string provider = 10;

  terraform.v1.Lifecycle lifecycle = 11;
}

// AwsEcrpublicImages version is 0
message AwsEcrpublicImages {
  repeated Images images = 1;

  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 2;

  // AWS account ID associated with the public registry that contains the repository.
  // If not specified, the default public registry is assumed.
  string registry_id = 3 [json_name = "registry_id"];

  // Name of the public repository.
  string repository_name = 4 [json_name = "repository_name"];

  repeated ImageIds image_ids = 5 [json_name = "image_ids"];

  google.protobuf.Value for_each = 6 [json_name = "for_each"];

  repeated string depends_on = 7 [json_name = "depends_on"];

  int32 count = 8;

  string provider = 9;

  terraform.v1.Lifecycle lifecycle = 10;

  message Images {
    // artifact_media_type: string
    string artifact_media_type = 1 [json_name = "artifact_media_type"];

    // image_digest: string
    string image_digest = 2 [json_name = "image_digest"];

    // image_manifest_media_type: string
    string image_manifest_media_type = 3 [json_name = "image_manifest_media_type"];

    // image_pushed_at: string
    string image_pushed_at = 4 [json_name = "image_pushed_at"];

    // image_size_in_bytes: number
    int64 image_size_in_bytes = 5 [json_name = "image_size_in_bytes"];

    // image_tags: list of string
    repeated string image_tags = 6 [json_name = "image_tags"];

    // registry_id: string
    string registry_id = 7 [json_name = "registry_id"];

    // repository_name: string
    string repository_name = 8 [json_name = "repository_name"];
  }

  message ImageIds {
    // Image digest.
    string image_digest = 1 [json_name = "image_digest"];

    // Image tag.
    string image_tag = 2 [json_name = "image_tag"];
  }
}
