syntax = "proto3";

// Provider: aws 6
package terraform.aws.datasources.v6;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// AwsCurReportDefinition version is 0
message AwsCurReportDefinition {
  repeated string additional_artifacts = 1 [json_name = "additional_artifacts"];

  repeated string additional_schema_elements = 2 [json_name = "additional_schema_elements"];

  string compression = 3;

  string format = 4;

  string id = 5;

  bool refresh_closed_reports = 6 [json_name = "refresh_closed_reports"];

  string report_name = 7 [json_name = "report_name"];

  string report_versioning = 8 [json_name = "report_versioning"];

  string s3_bucket = 9 [json_name = "s3_bucket"];

  string s3_prefix = 10 [json_name = "s3_prefix"];

  string s3_region = 11 [json_name = "s3_region"];

  map<string, string> tags = 12;

  string time_unit = 13 [json_name = "time_unit"];

  google.protobuf.Value for_each = 14 [json_name = "for_each"];

  repeated string depends_on = 15 [json_name = "depends_on"];

  int32 count = 16;

  string provider = 17;

  terraform.v1.Lifecycle lifecycle = 18;
}
