  string search_service_endpoint = 8 [json_name = "search_service_endpoint"];

  EndpointOptions endpoint_options = 9 [json_name = "endpoint_options"];

  repeated IndexField index_field = 10 [json_name = "index_field"];

  ScalingParameters scaling_parameters = 11 [json_name = "scaling_parameters"];

  repeated Timeouts timeouts = 12;

  google.protobuf.Value for_each = 13 [json_name = "for_each"];

  repeated string depends_on = 14 [json_name = "depends_on"];

  int32 count = 15;

