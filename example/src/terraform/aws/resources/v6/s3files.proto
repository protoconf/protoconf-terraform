  // Access point status
  string status = 7;

  map<string, string> tags = 8;

  map<string, string> tags_all = 9 [json_name = "tags_all"];

  repeated PosixUser posix_user = 10 [json_name = "posix_user"];

  repeated RootDirectory root_directory = 11 [json_name = "root_directory"];

  repeated Timeouts timeouts = 12;

  google.protobuf.Value for_each = 13 [json_name = "for_each"];

  repeated string depends_on = 14 [json_name = "depends_on"];

  int32 count = 15;

  string provider = 16;

  terraform.v1.Lifecycle lifecycle = 17;

  message PosixUser {
    // POSIX group ID
    int64 gid = 1;

    // Secondary POSIX group IDs
    repeated int64 secondary_gids = 2 [json_name = "secondary_gids"];

    // POSIX user ID
    int64 uid = 3;
  }

  message RootDirectory {
    // Root directory path
    string path = 1;

    repeated CreationPermissions creation_permissions = 2 [json_name = "creation_permissions"];

    message CreationPermissions {
      // Owner group ID
      int64 owner_gid = 1 [json_name = "owner_gid"];

      // Owner user ID
      int64 owner_uid = 2 [json_name = "owner_uid"];

      // POSIX permissions
      string permissions = 3;
    }
  }

  message Timeouts {
    // A string that can be [parsed as a
    // duration](https://pkg.go.dev/time#ParseDuration) consisting of numbers and unit
    // suffixes, such as "30s" or "2h45m". Valid time units are "s" (seconds), "m"
