syntax = "proto3";

// Provider: aws 6
package terraform.aws.resources.v6;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// AwsResiliencehubResiliencyPolicy version is 1
message AwsResiliencehubResiliencyPolicy {
  string arn = 1;

  // Specifies a high-level geographical location constraint for where resilience
  // policy data can be stored.
  string data_location_constraint = 2 [json_name = "data_location_constraint"];

  // The description for the policy.
  string description = 3;

  // Specifies the estimated cost tier of the resiliency policy.
  string estimated_cost_tier = 4 [json_name = "estimated_cost_tier"];

  // The name of the policy.
  string name = 5;

  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 6;

  map<string, string> tags = 7;

  map<string, string> tags_all = 8 [json_name = "tags_all"];

  // The tier for the resiliency policy, ranging from the highest severity
  // (MissionCritical) to lowest (NonCritical).
  string tier = 9;

  repeated Policy policy = 10;

  repeated Timeouts timeouts = 11;

  google.protobuf.Value for_each = 12 [json_name = "for_each"];

  repeated string depends_on = 13 [json_name = "depends_on"];

  int32 count = 14;

  string provider = 15;

  terraform.v1.Lifecycle lifecycle = 16;

  message Policy {
    repeated Az az = 1;

    repeated Hardware hardware = 2;

    repeated Region region = 3;

    repeated Software software = 4;

    message Az {
      // Recovery Point Objective (RPO) as a Go duration.
      string rpo = 1;

      // Recovery Time Objective (RTO) as a Go duration.
      string rto = 2;
    }

    message Hardware {
      // Recovery Point Objective (RPO) as a Go duration.
      string rpo = 1;

      // Recovery Time Objective (RTO) as a Go duration.
      string rto = 2;
    }

    message Region {
      // Recovery Point Objective (RPO) as a Go duration.
      string rpo = 1;

      // Recovery Time Objective (RTO) as a Go duration.
      string rto = 2;
    }

    message Software {
      // Recovery Point Objective (RPO) as a Go duration.
      string rpo = 1;

      // Recovery Time Objective (RTO) as a Go duration.
      string rto = 2;
    }
  }

  message Timeouts {
    // A string that can be [parsed as a
    // duration](https://pkg.go.dev/time#ParseDuration) consisting of numbers and unit
    // suffixes, such as "30s" or "2h45m". Valid time units are "s" (seconds), "m"
    // (minutes), "h" (hours).
    string create = 1;

    // A string that can be [parsed as a
    // duration](https://pkg.go.dev/time#ParseDuration) consisting of numbers and unit
    // suffixes, such as "30s" or "2h45m". Valid time units are "s" (seconds), "m"
    // (minutes), "h" (hours). Setting a timeout for a Delete operation is only
    // applicable if changes are saved into state before the destroy operation occurs.
    string delete = 2;

    // A string that can be [parsed as a
    // duration](https://pkg.go.dev/time#ParseDuration) consisting of numbers and unit
    // suffixes, such as "30s" or "2h45m". Valid time units are "s" (seconds), "m"
    // (minutes), "h" (hours).
    string update = 3;
  }
}
