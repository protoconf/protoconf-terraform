syntax = "proto3";

// Provider: aws 6
package terraform.aws.resources.v6;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// AwsMwaaEnvironment version is 0
message AwsMwaaEnvironment {
  map<string, string> airflow_configuration_options = 1 [json_name = "airflow_configuration_options"];

  string airflow_version = 2 [json_name = "airflow_version"];

  string arn = 3;

  string created_at = 4 [json_name = "created_at"];

  string dag_s3_path = 5 [json_name = "dag_s3_path"];

  string database_vpc_endpoint_service = 6 [json_name = "database_vpc_endpoint_service"];

  string endpoint_management = 7 [json_name = "endpoint_management"];

  string environment_class = 8 [json_name = "environment_class"];

  string execution_role_arn = 9 [json_name = "execution_role_arn"];

  string id = 10;

  string kms_key = 11 [json_name = "kms_key"];

  repeated LastUpdated last_updated = 12 [json_name = "last_updated"];

  int64 max_webservers = 13 [json_name = "max_webservers"];

  int64 max_workers = 14 [json_name = "max_workers"];

  int64 min_webservers = 15 [json_name = "min_webservers"];

  int64 min_workers = 16 [json_name = "min_workers"];

  string name = 17;

  string plugins_s3_object_version = 18 [json_name = "plugins_s3_object_version"];

  string plugins_s3_path = 19 [json_name = "plugins_s3_path"];

  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 20;

  string requirements_s3_object_version = 21 [json_name = "requirements_s3_object_version"];

  string requirements_s3_path = 22 [json_name = "requirements_s3_path"];

  int64 schedulers = 23;

  string service_role_arn = 24 [json_name = "service_role_arn"];

  string source_bucket_arn = 25 [json_name = "source_bucket_arn"];

  string startup_script_s3_object_version = 26 [json_name = "startup_script_s3_object_version"];

  string startup_script_s3_path = 27 [json_name = "startup_script_s3_path"];

  string status = 28;

  map<string, string> tags = 29;

  map<string, string> tags_all = 30 [json_name = "tags_all"];

  string webserver_access_mode = 31 [json_name = "webserver_access_mode"];

  string webserver_url = 32 [json_name = "webserver_url"];

  string webserver_vpc_endpoint_service = 33 [json_name = "webserver_vpc_endpoint_service"];

  string weekly_maintenance_window_start = 34 [json_name = "weekly_maintenance_window_start"];

  string worker_replacement_strategy = 35 [json_name = "worker_replacement_strategy"];

  LoggingConfiguration logging_configuration = 36 [json_name = "logging_configuration"];

  NetworkConfiguration network_configuration = 37 [json_name = "network_configuration"];

  repeated Timeouts timeouts = 38;

  google.protobuf.Value for_each = 39 [json_name = "for_each"];

  repeated string depends_on = 40 [json_name = "depends_on"];

  int32 count = 41;

  string provider = 42;

  terraform.v1.Lifecycle lifecycle = 43;

  message LastUpdated {
    // created_at: string
    string created_at = 1 [json_name = "created_at"];

    // error: list of object
    repeated Error error = 2;

    // status: string
    string status = 3;

    message Error {
      // error_code: string
      string error_code = 1 [json_name = "error_code"];

      // error_message: string
      string error_message = 2 [json_name = "error_message"];
    }
  }

  message LoggingConfiguration {
    DagProcessingLogs dag_processing_logs = 1 [json_name = "dag_processing_logs"];

    SchedulerLogs scheduler_logs = 2 [json_name = "scheduler_logs"];

    TaskLogs task_logs = 3 [json_name = "task_logs"];

    WebserverLogs webserver_logs = 4 [json_name = "webserver_logs"];

    WorkerLogs worker_logs = 5 [json_name = "worker_logs"];

    message DagProcessingLogs {
      string cloud_watch_log_group_arn = 1 [json_name = "cloud_watch_log_group_arn"];

      bool enabled = 2;

      string log_level = 3 [json_name = "log_level"];
    }

    message SchedulerLogs {
      string cloud_watch_log_group_arn = 1 [json_name = "cloud_watch_log_group_arn"];

      bool enabled = 2;

      string log_level = 3 [json_name = "log_level"];
    }

    message TaskLogs {
      string cloud_watch_log_group_arn = 1 [json_name = "cloud_watch_log_group_arn"];

      bool enabled = 2;

      string log_level = 3 [json_name = "log_level"];
    }

    message WebserverLogs {
      string cloud_watch_log_group_arn = 1 [json_name = "cloud_watch_log_group_arn"];

      bool enabled = 2;

      string log_level = 3 [json_name = "log_level"];
    }

    message WorkerLogs {
      string cloud_watch_log_group_arn = 1 [json_name = "cloud_watch_log_group_arn"];

      bool enabled = 2;

      string log_level = 3 [json_name = "log_level"];
    }
  }

  message NetworkConfiguration {
    repeated string security_group_ids = 1 [json_name = "security_group_ids"];

    repeated string subnet_ids = 2 [json_name = "subnet_ids"];
  }

  message Timeouts {
    string create = 1;

    string delete = 2;

    string update = 3;
  }
}
