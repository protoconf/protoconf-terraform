syntax = "proto3";

// Provider: aws 6
package terraform.aws.resources.v6;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// AwsKeyPair version is 1
message AwsKeyPair {
  string arn = 1;

  string fingerprint = 2;

  string id = 3;

  string key_name = 4 [json_name = "key_name"];

  string key_name_prefix = 5 [json_name = "key_name_prefix"];

  string key_pair_id = 6 [json_name = "key_pair_id"];

  string key_type = 7 [json_name = "key_type"];

  string public_key = 8 [json_name = "public_key"];

  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 9;

  map<string, string> tags = 10;

  map<string, string> tags_all = 11 [json_name = "tags_all"];

  google.protobuf.Value for_each = 12 [json_name = "for_each"];

  repeated string depends_on = 13 [json_name = "depends_on"];

  int32 count = 14;

  string provider = 15;

  terraform.v1.Lifecycle lifecycle = 16;
}
