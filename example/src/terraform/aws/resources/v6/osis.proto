syntax = "proto3";

// Provider: aws 6
package terraform.aws.resources.v6;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// AwsOsisPipeline version is 0
message AwsOsisPipeline {
  string id = 1;

  repeated string ingest_endpoint_urls = 2 [json_name = "ingest_endpoint_urls"];

  int64 max_units = 3 [json_name = "max_units"];

  int64 min_units = 4 [json_name = "min_units"];

  string pipeline_arn = 5 [json_name = "pipeline_arn"];

  string pipeline_configuration_body = 6 [json_name = "pipeline_configuration_body"];

  string pipeline_name = 7 [json_name = "pipeline_name"];

  string pipeline_role_arn = 8 [json_name = "pipeline_role_arn"];

  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 9;

  map<string, string> tags = 10;

  map<string, string> tags_all = 11 [json_name = "tags_all"];

  repeated BufferOptions buffer_options = 12 [json_name = "buffer_options"];

  repeated EncryptionAtRestOptions encryption_at_rest_options = 13 [json_name = "encryption_at_rest_options"];

  repeated LogPublishingOptions log_publishing_options = 14 [json_name = "log_publishing_options"];

  repeated Timeouts timeouts = 15;

  repeated VpcOptions vpc_options = 16 [json_name = "vpc_options"];

  google.protobuf.Value for_each = 17 [json_name = "for_each"];

  repeated string depends_on = 18 [json_name = "depends_on"];

  int32 count = 19;

  string provider = 20;

  terraform.v1.Lifecycle lifecycle = 21;

  message BufferOptions {
    bool persistent_buffer_enabled = 1 [json_name = "persistent_buffer_enabled"];
  }

  message EncryptionAtRestOptions {
    string kms_key_arn = 1 [json_name = "kms_key_arn"];
  }

  message LogPublishingOptions {
    bool is_logging_enabled = 1 [json_name = "is_logging_enabled"];

    repeated CloudwatchLogDestination cloudwatch_log_destination = 2 [json_name = "cloudwatch_log_destination"];

    message CloudwatchLogDestination {
      string log_group = 1 [json_name = "log_group"];
    }
  }

  message Timeouts {
    // A string that can be [parsed as a
    // duration](https://pkg.go.dev/time#ParseDuration) consisting of numbers and unit
    // suffixes, such as "30s" or "2h45m". Valid time units are "s" (seconds), "m"
    // (minutes), "h" (hours).
    string create = 1;

    // A string that can be [parsed as a
    // duration](https://pkg.go.dev/time#ParseDuration) consisting of numbers and unit
    // suffixes, such as "30s" or "2h45m". Valid time units are "s" (seconds), "m"
    // (minutes), "h" (hours). Setting a timeout for a Delete operation is only
    // applicable if changes are saved into state before the destroy operation occurs.
    string delete = 2;

    // A string that can be [parsed as a
    // duration](https://pkg.go.dev/time#ParseDuration) consisting of numbers and unit
    // suffixes, such as "30s" or "2h45m". Valid time units are "s" (seconds), "m"
    // (minutes), "h" (hours).
    string update = 3;
  }

  message VpcOptions {
    repeated string security_group_ids = 1 [json_name = "security_group_ids"];

    repeated string subnet_ids = 2 [json_name = "subnet_ids"];

    string vpc_endpoint_management = 3 [json_name = "vpc_endpoint_management"];
  }
