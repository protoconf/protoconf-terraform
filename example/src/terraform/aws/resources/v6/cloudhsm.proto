  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 7;

  string security_group_id = 8 [json_name = "security_group_id"];

  string source_backup_identifier = 9 [json_name = "source_backup_identifier"];

  repeated string subnet_ids = 10 [json_name = "subnet_ids"];

  map<string, string> tags = 11;

  map<string, string> tags_all = 12 [json_name = "tags_all"];

  string vpc_id = 13 [json_name = "vpc_id"];

  repeated Timeouts timeouts = 14;

  google.protobuf.Value for_each = 15 [json_name = "for_each"];

  repeated string depends_on = 16 [json_name = "depends_on"];

  int32 count = 17;

  string provider = 18;

  terraform.v1.Lifecycle lifecycle = 19;

  message ClusterCertificates {
