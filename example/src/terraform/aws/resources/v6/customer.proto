syntax = "proto3";

// Provider: aws 6
package terraform.aws.resources.v6;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// AwsCustomerGateway version is 0
message AwsCustomerGateway {
  string arn = 1;

  string bgp_asn = 2 [json_name = "bgp_asn"];

  string bgp_asn_extended = 3 [json_name = "bgp_asn_extended"];

  string certificate_arn = 4 [json_name = "certificate_arn"];

  string device_name = 5 [json_name = "device_name"];

  string id = 6;

  string ip_address = 7 [json_name = "ip_address"];

  // Region where this resource will be
  // ed](https://docs.aws.amazon.com/general/latest/gr/rande.html#regional-endpoints).
  // Defaults to the Region set in the [provider
  // ry.terraform.io/providers/hashicorp/aws/latest/docs#aws-configuration-reference).
  string region = 8;

  map<string, string> tags = 9;

  map<string, string> tags_all = 10 [json_name = "tags_all"];

  string type = 11;

  google.protobuf.Value for_each = 12 [json_name = "for_each"];

  repeated string depends_on = 13 [json_name = "depends_on"];

  int32 count = 14;

  string provider = 15;

  terraform.v1.Lifecycle lifecycle = 16;
}
