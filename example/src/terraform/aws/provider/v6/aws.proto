  optional string ec2_metadata_service_endpoint = 4 [json_name = "ec2_metadata_service_endpoint"];

  // Protocol to use with EC2 metadata service endpoint.Valid values are `IPv4` and
  // `IPv6`. Can also be configured using the `AWS_EC2_METADATA_SERVICE_ENDPOINT_MODE`
  // environment variable.
  optional string ec2_metadata_service_endpoint_mode = 5 [json_name = "ec2_metadata_service_endpoint_mode"];

  repeated string forbidden_account_ids = 6 [json_name = "forbidden_account_ids"];

  // URL of a proxy to use for HTTP requests when accessing the AWS API. Can also be
  // set using the `HTTP_PROXY` or `http_proxy` environment variables.
  optional string http_proxy = 7 [json_name = "http_proxy"];

  // URL of a proxy to use for HTTPS requests when accessing the AWS API. Can also be
  // set using the `HTTPS_PROXY` or `https_proxy` environment variables.
  optional string https_proxy = 8 [json_name = "https_proxy"];

  // Explicitly allow the provider to perform "insecure" SSL requests. If omitted,
  // default value is `false`
  optional bool insecure = 9;

  // The maximum number of times an AWS API request is
  //
  // being executed. If the API request still fails, an error is
  //
  // thrown.
  optional int64 max_retries = 10 [json_name = "max_retries"];

  // Comma-separated list of hosts that should not use HTTP or HTTPS proxies. Can also
  // be set using the `NO_PROXY` or `no_proxy` environment variables.
  optional string no_proxy = 11 [json_name = "no_proxy"];

  // The profile for API operations. If not set, the default profile
  //
  // created with `aws configure` will be used.
  optional string profile = 12;

  // The region where AWS operations will take place. Examples
  //
  // are us-east-1, us-west-2, etc.
  optional string region = 13;

  // Specifies how retries are attempted. Valid values are `standard` and `adaptive`.
  // Can also be configured using the `AWS_RETRY_MODE` environment variable.
  optional string retry_mode = 14 [json_name = "retry_mode"];

  // Specifies whether S3 API calls in the `us-east-1` region use the legacy global
  // endpoint or a regional endpoint. Valid values are `legacy` or `regional`. Can
  // also be configured using the `AWS_S3_US_EAST_1_REGIONAL_ENDPOINT` environment
  // variable or the `s3_us_east_1_regional_endpoint` shared config file parameter
  optional string s3_us_east_1_regional_endpoint = 15 [json_name = "s3_us_east_1_regional_endpoint"];

  // Set this to true to enable the request to use path-style addressing,
  //
  // i.e., https://s3.amazonaws.com/BUCKET/KEY. By default, the S3 client will
  //
  // use virtual hosted bucket addressing when possible
  //
  // (https://BUCKET.s3.amazonaws.com/KEY). Specific to the Amazon S3 service.
  optional bool s3_use_path_style = 16 [json_name = "s3_use_path_style"];

  // The secret key for API operations. You can retrieve this
  //
  // from the 'Security & Credentials' section of the AWS console.
  optional string secret_key = 17 [json_name = "secret_key"];

