    optional string role_arn = 5 [json_name = "role_arn"];

    // An identifier for the assumed role session.
    optional string session_name = 6 [json_name = "session_name"];

    // Source identity specified by the principal assuming the role.
    optional string source_identity = 7 [json_name = "source_identity"];

    // Assume role session tags.
    map<string, string> tags = 8;

    // Assume role session tag keys to pass to any subsequent sessions.
    repeated string transitive_tag_keys = 9 [json_name = "transitive_tag_keys"];
