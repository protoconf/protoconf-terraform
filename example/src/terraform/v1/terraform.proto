    map<string, terraform.aws.datasources.v6.AwsVpcSecurityGroupRules> aws_vpc_security_group_rules = 633 [json_name = "aws_vpc_security_group_rules"];

    map<string, terraform.aws.datasources.v6.AwsVpclatticeAuthPolicy> aws_vpclattice_auth_policy = 634 [json_name = "aws_vpclattice_auth_policy"];

    map<string, terraform.aws.datasources.v6.AwsVpclatticeListener> aws_vpclattice_listener = 635 [json_name = "aws_vpclattice_listener"];

    map<string, terraform.aws.datasources.v6.AwsVpclatticeResourcePolicy> aws_vpclattice_resource_policy = 636 [json_name = "aws_vpclattice_resource_policy"];

    map<string, terraform.aws.datasources.v6.AwsVpclatticeService> aws_vpclattice_service = 637 [json_name = "aws_vpclattice_service"];

    map<string, terraform.aws.datasources.v6.AwsVpclatticeServiceNetwork> aws_vpclattice_service_network = 638 [json_name = "aws_vpclattice_service_network"];

    map<string, terraform.aws.datasources.v6.AwsVpcs> aws_vpcs = 639 [json_name = "aws_vpcs"];

    map<string, terraform.aws.datasources.v6.AwsVpnConnection> aws_vpn_connection = 640 [json_name = "aws_vpn_connection"];

    map<string, terraform.aws.datasources.v6.AwsVpnGateway> aws_vpn_gateway = 641 [json_name = "aws_vpn_gateway"];

    map<string, terraform.aws.datasources.v6.AwsWafIpset> aws_waf_ipset = 642 [json_name = "aws_waf_ipset"];

    map<string, terraform.aws.datasources.v6.AwsWafRateBasedRule> aws_waf_rate_based_rule = 643 [json_name = "aws_waf_rate_based_rule"];

    map<string, terraform.aws.datasources.v6.AwsWafRule> aws_waf_rule = 644 [json_name = "aws_waf_rule"];

    map<string, terraform.aws.datasources.v6.AwsWafSubscribedRuleGroup> aws_waf_subscribed_rule_group = 645 [json_name = "aws_waf_subscribed_rule_group"];

    map<string, terraform.aws.datasources.v6.AwsWafWebAcl> aws_waf_web_acl = 646 [json_name = "aws_waf_web_acl"];

    map<string, terraform.aws.datasources.v6.AwsWafregionalIpset> aws_wafregional_ipset = 647 [json_name = "aws_wafregional_ipset"];

    map<string, terraform.aws.datasources.v6.AwsWafregionalRateBasedRule> aws_wafregional_rate_based_rule = 648 [json_name = "aws_wafregional_rate_based_rule"];

    map<string, terraform.aws.datasources.v6.AwsWafregionalRule> aws_wafregional_rule = 649 [json_name = "aws_wafregional_rule"];

    map<string, terraform.aws.datasources.v6.AwsWafregionalSubscribedRuleGroup> aws_wafregional_subscribed_rule_group = 650 [
      json_name = "aws_wafregional_subscribed_rule_group"
    ];

    map<string, terraform.aws.datasources.v6.AwsWafregionalWebAcl> aws_wafregional_web_acl = 651 [json_name = "aws_wafregional_web_acl"];

    map<string, terraform.aws.datasources.v6.AwsWafv2IpSet> aws_wafv2_ip_set = 652 [json_name = "aws_wafv2_ip_set"];

    map<string, terraform.aws.datasources.v6.AwsWafv2ManagedRuleGroup> aws_wafv2_managed_rule_group = 653 [json_name = "aws_wafv2_managed_rule_group"];

    map<string, terraform.aws.datasources.v6.AwsWafv2RegexPatternSet> aws_wafv2_regex_pattern_set = 654 [json_name = "aws_wafv2_regex_pattern_set"];

    map<string, terraform.aws.datasources.v6.AwsWafv2RuleGroup> aws_wafv2_rule_group = 655 [json_name = "aws_wafv2_rule_group"];

