syntax = "proto3";

// Provider: random 3
package terraform.random.resources.v3;

import "google/protobuf/struct.proto";

import "terraform/v1/meta.proto";

// RandomBytes version is 0
message RandomBytes {
  // The generated bytes presented in base64 string format.
  string base64 = 1;

  // The generated bytes presented in lowercase hexadecimal string format. The length
  // of the encoded string is exactly twice the `length` parameter.
  string hex = 2;

  // Arbitrary map of values that, when changed, will trigger recreation of resource.
  // See [the main provider documentation](../index.html) for more information.
  map<string, string> keepers = 3;

  // The number of bytes requested. The minimum value for length is 1.
  int64 length = 4;

  google.protobuf.Value for_each = 5 [json_name = "for_each"];

  repeated string depends_on = 6 [json_name = "depends_on"];

  int32 count = 7;

  string provider = 8;

  terraform.v1.Lifecycle lifecycle = 9;
}
